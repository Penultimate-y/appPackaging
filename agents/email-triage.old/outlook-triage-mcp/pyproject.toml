[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outlook-triage-mcp"
version = "0.1.0"
description = "MCP server for Microsoft 365 mail: search, classify, and triage your inbox from Claude via Microsoft Graph."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Giuseppe Ferretti", email = "giuseppe@iterlabs.com.br" }]
requires-python = ">=3.11"
keywords = ["mcp", "outlook", "microsoft-graph", "email", "triage", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
]
dependencies = [
    "mcp>=1.10",
    "msal>=1.27",
    "requests>=2.31",
]

[project.optional-dependencies]
attachments = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.scripts]
outlook-triage-mcp = "outlook_triage_mcp.server:main"

[project.urls]
Homepage = "https://github.com/giuseppeferretti/outlook-triage-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_triage_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
